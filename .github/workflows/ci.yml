name: CI

on:
  push:
  pull_request:

env:
  SMOKE_SCHEMA: |
    enum Status {
        ACTIVE;
        INACTIVE;
    }

    message User {
        string id;
        string name;
        int age;
        bool active;
        Status status;
        string[] tags;
        map<string, int> scores;
        int optional_age?;
    }

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.3

      - name: Version tests
        run: bundle exec ruby test/forge_test.rb --verbose

      - name: Lexer tests
        run: bundle exec ruby test/lexer_test.rb --verbose

      - name: Parser tests
        run: bundle exec ruby test/parser_test.rb --verbose

      - name: Semantic analyzer tests
        run: bundle exec ruby test/semantic_analyzer_test.rb --verbose

      - name: Haxe generator tests
        run: bundle exec ruby test/generator_test.rb --verbose

      - name: TypeScript generator tests
        run: bundle exec ruby test/typescript_test.rb --verbose

      - name: Go generator tests
        run: bundle exec ruby test/go_test.rb --verbose

      - name: Rust generator tests
        run: bundle exec ruby test/rust_test.rb --verbose

      - name: CLI tests
        run: bundle exec ruby test/cli_test.rb --verbose

      - name: Import tests
        run: bundle exec ruby test/import_test.rb --verbose

      - name: Haxe integration tests
        run: bundle exec ruby test/integration_test.rb --verbose

  gem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build and install gem
        run: |
          gem build forge.gemspec
          gem install ./forge-*.gem
          echo "$(ruby -e 'print Gem.bindir')" >> "$GITHUB_PATH"

      - name: CLI smoke
        run: |
          printf '%s' "$SMOKE_SCHEMA" > /tmp/ci_smoke.forge
          forge() { ruby -Ilib -r forge -e 'exit Forge::CLI.new(ARGV).run' "$@"; }
          forge version
          forge check /tmp/ci_smoke.forge
          forge generate /tmp/ci_smoke.forge --target haxe --out /tmp/ci_gen_hx
          forge generate /tmp/ci_smoke.forge --target typescript --out /tmp/ci_gen_ts
          forge generate /tmp/ci_smoke.forge --target go --out /tmp/ci_gen_go
          forge generate /tmp/ci_smoke.forge --target rust --out /tmp/ci_gen_rs
          test -f /tmp/ci_gen_hx/User.hx
          test -f /tmp/ci_gen_ts/User.ts
          test -f /tmp/ci_gen_go/User.go
          test -f /tmp/ci_gen_rs/User.rs

  verify-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile generated TypeScript
        run: |
          printf '%s' "$SMOKE_SCHEMA" > /tmp/ci_smoke.forge
          ruby -Ilib -r forge -e 'exit Forge::CLI.new(ARGV).run' generate /tmp/ci_smoke.forge --target typescript > /tmp/ci_schema.ts
          npm install --no-save typescript@5
          ./node_modules/.bin/tsc --noEmit --strict /tmp/ci_schema.ts

  verify-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Compile generated Go
        run: |
          printf '%s' "$SMOKE_SCHEMA" > /tmp/ci_smoke.forge
          ruby -Ilib -r forge -e 'exit Forge::CLI.new(ARGV).run' generate /tmp/ci_smoke.forge --target go --out /tmp/ci_gen_go
          cd /tmp/ci_gen_go
          go mod init schema
          go vet .

  verify-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Compile generated Rust
        run: |
          printf '%s' "$SMOKE_SCHEMA" > /tmp/ci_smoke.forge
          ruby -Ilib -r forge -e 'exit Forge::CLI.new(ARGV).run' generate /tmp/ci_smoke.forge --target rust > /tmp/ci_schema.rs
          rustc --edition 2021 --crate-type lib -o /tmp/libschema.rlib /tmp/ci_schema.rs
